server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 8.133.224.94;
    ssl_certificate /etc/letsencrypt/live/drama-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drama-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DRAMA_TLS:1m;
    server_tokens off;

    # Authentication is handled by the platform session login.
    auth_basic off;
    root /home/admin/drama-platform/frontend/dist;
    index index.html;
    client_max_body_size 21m;

    # --- 安全响应头 ---
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'self'" always;

    charset utf-8;

    gzip on;
    gzip_types application/javascript text/css application/json;
    gzip_vary on;

    # ACME http-01 保底（正常走 80 端口，这里防误伤）
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    # 点文件一律拒绝（.git/.env 等），避免 SPA fallback 把它们当页面返回
    location ~ /\.(?!well-known) {
        deny all;
    }

    location = /favicon.ico {
        alias /home/admin/drama-platform/frontend/dist/favicon.ico;
        expires 7d;
        access_log off;
    }

    location ^~ /api/asset-links/ {
        access_log off;
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    # 私有媒体：保留后端下发的 private 缓存头
    location ~ ^/api/assets/[0-9]+/(file|thumbnail)/ {
        access_log off;
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    # Django 后台不对公网开放：需要时用 ssh -L 8010:127.0.0.1:8010 走回环入口
    location = /admin {
        return 404;
    }
    location ^~ /admin/ {
        return 404;
    }

    # 健康检查仅本机
    location = /health/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /static/ {
        alias /home/admin/drama-platform/backend/staticfiles/;
    }

    location = /assets { try_files /index.html =404; }
    location = /assets/ { try_files /index.html =404; }

    # 构建产物文件名带内容 hash，长缓存
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # 原有 /demo 演示站：HSTS 生效后浏览器会把 http 升级到 https，这里保持可用
    location ^~ /demo/api/ {
        charset utf-8;
        client_max_body_size 25m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:8020/api/;
    }
    location ^~ /demo/samples/ {
        alias /opt/imgdemo/samples/;
        expires 1h;
    }
    location ^~ /demo/ {
        alias /opt/imgdemo/static/;
        index index.html;
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

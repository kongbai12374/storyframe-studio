server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name studio.example.com;
    ssl_certificate /etc/letsencrypt/live/drama-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drama-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DRAMA_TLS:1m;
    # Authentication is handled by the platform session login.
    auth_basic off;
    root /opt/storyframe-studio/frontend/dist;
    index index.html;
    client_max_body_size 21m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'self'" always;
    gzip on;
    gzip_types application/javascript text/css application/json;
    location ^~ /api/asset-links/ {
        access_log off;
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
    location /admin/ {
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /health/ {
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /static/ { alias /opt/storyframe-studio/backend/staticfiles/; }
    location = /assets { try_files /index.html =404; }
    location = /assets/ { try_files /index.html =404; }
    location /assets/ { try_files $uri =404; expires 7d; }
    location / { try_files $uri $uri/ /index.html; }
}

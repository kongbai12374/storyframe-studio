server {
 listen 127.0.0.1:8010;
 server_name localhost 127.0.0.1;
 root /opt/storyframe-studio/frontend/dist;
 index index.html;
 client_max_body_size 21m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'self'" always;
 gzip on;
 gzip_types application/javascript text/css application/json;
 location /api/ { proxy_pass http://127.0.0.1:8011; proxy_set_header Host $http_host; proxy_read_timeout 30s; }
 location /admin/ { proxy_pass http://127.0.0.1:8011; proxy_set_header Host $http_host; }
 location /health/ { proxy_pass http://127.0.0.1:8011; proxy_set_header Host $http_host; }
 location /static/ { alias /opt/storyframe-studio/backend/staticfiles/; }
 location = /assets { try_files /index.html =404; }
    location = /assets/ { try_files /index.html =404; }
    location /assets/ { try_files $uri =404; expires 7d; }
 location / { try_files $uri $uri/ /index.html; }
}
